name: Build Standalone Binaries (macOS, Windows, Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            artifact_name: SmjrifleReminder-macOS.zip
          - os: windows-latest
            artifact_name: SmjrifleReminder-Windows.zip
          - os: ubuntu-latest
            artifact_name: SmjrifleReminder-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # --- macOS Build ---
      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller SmjrifleReminder.spec -y --clean
          ditto -c -k --sequesterRsrc --keepParent dist/SmjrifleReminder.app dist/SmjrifleReminder-macOS.zip

      # --- Windows Build ---
      - name: Build Windows Standalone Executable
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --noconsole --onefile --name "SmjrifleReminder" --icon "icon.ico" --add-data "character.gif;." --add-data "icon.png;." --add-data "icon.ico;." --add-data "assets;assets" -y --clean main.py
          powershell Compress-Archive -Path dist/SmjrifleReminder.exe, assets, character.gif, icon.png, icon.ico, README.md, LICENSE -DestinationPath dist/SmjrifleReminder-Windows.zip

      # --- Linux Build ---
      - name: Build Linux Standalone Executable
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0
          pyinstaller --noconsole --onefile --name "smjrifle-reminder" --icon "icon.png" --add-data "character.gif:." --add-data "icon.png:." --add-data "assets:assets" -y --clean main.py
          tar -czf dist/SmjrifleReminder-Linux.tar.gz -C dist smjrifle-reminder

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
